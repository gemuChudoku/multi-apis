name: Build & Push all services to ACR (multi-registry)

on:
  push:
    branches: [ "master" ]
    paths:
      - "users-api/**"
      - "products-api/**"
      - "sales-api/**"
      - "refunds-api/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: users-api
            context: users-api
            image: users-api
            registry: 1

          - service: products-api
            context: products-api
            image: products-api
            registry: 1

          - service: sales-api
            context: sales-api
            image: sales-api
            registry: 2

          - service: refunds-api
            context: refunds-api
            image: refunds-api
            registry: 2

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔐 Azure Login (Service Principal)
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: 🔑 Login to ACR 1
        if: matrix.registry == 1
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: 🔑 Login to ACR 2
        if: matrix.registry == 2
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER2 }}
          username: ${{ secrets.ACR_USERNAME2 }}
          password: ${{ secrets.ACR_PASSWORD2 }}

      - name: 🏷️ Set version tag (short sha)
        id: vars
        run: echo "TAG=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: 🏗️ Build & Push ${{ matrix.service }} to ACR ${{ matrix.registry }}
        run: |
          # Determine which registry to use
          if [ "${{ matrix.registry }}" == "1" ]; then
            REGISTRY="${{ secrets.ACR_LOGIN_SERVER }}"
          else
            REGISTRY="${{ secrets.ACR_LOGIN_SERVER2 }}"
          fi
          
          docker build -t $REGISTRY/${{ matrix.image }}:latest ${{ matrix.context }}
          docker tag $REGISTRY/${{ matrix.image }}:latest $REGISTRY/${{ matrix.image }}:${{ steps.vars.outputs.TAG }}
          docker push $REGISTRY/${{ matrix.image }}:latest
          docker push $REGISTRY/${{ matrix.image }}:${{ steps.vars.outputs.TAG }}